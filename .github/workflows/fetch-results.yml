name: Fetch Match Results

on:
  schedule:
    # Every 5 minutes, all day — catches results from any timezone
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_recalculate:
        description: 'Re-run calculate-points for ALL finished matches (fixes missing points)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Call fetch-results edge function
        run: |
          BODY='{"force_recalculate":${{ github.event.inputs.force_recalculate || 'false' }}}'
          curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/fetch-results" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$BODY"
          cat response.json
