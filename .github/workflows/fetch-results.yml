name: Fetch Match Results

on:
  schedule:
    # Runs every 5 minutes during tournament hours (10:00–23:59 UTC)
    # Group stage matches kick off between 17:00–23:00 UTC
    - cron: '*/5 10-23 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Debug — what does football-data.org return for WC 2026?
        run: |
          echo "=== IN_PLAY ==="
          curl -s "https://api.football-data.org/v4/competitions/WC/matches?season=2026&status=IN_PLAY" \
            -H "X-Auth-Token: ${{ secrets.FOOTBALL_DATA_KEY }}" | python3 -c "import sys,json; d=json.load(sys.stdin); matches=d.get('matches',[]); print(f'{len(matches)} matches'); [print(m['id'], m['status'], m.get('homeTeam',{}).get('name'), 'vs', m.get('awayTeam',{}).get('name')) for m in matches[:5]]" 2>/dev/null || echo "(parse error or empty)"
          echo "=== FINISHED ==="
          curl -s "https://api.football-data.org/v4/competitions/WC/matches?season=2026&status=FINISHED" \
            -H "X-Auth-Token: ${{ secrets.FOOTBALL_DATA_KEY }}" | python3 -c "import sys,json; d=json.load(sys.stdin); matches=d.get('matches',[]); print(f'{len(matches)} matches'); [print(m['id'], m['status'], m.get('homeTeam',{}).get('name'), 'vs', m.get('awayTeam',{}).get('name')) for m in matches[:5]]" 2>/dev/null || echo "(parse error or empty)"
          echo "=== SCHEDULED (first 3) ==="
          curl -s "https://api.football-data.org/v4/competitions/WC/matches?season=2026&status=SCHEDULED" \
            -H "X-Auth-Token: ${{ secrets.FOOTBALL_DATA_KEY }}" | python3 -c "import sys,json; d=json.load(sys.stdin); matches=d.get('matches',[]); print(f'{len(matches)} matches'); [print(m['id'], m['status'], m.get('homeTeam',{}).get('name'), 'vs', m.get('awayTeam',{}).get('name')) for m in matches[:3]]" 2>/dev/null || echo "(parse error or empty)"

      - name: Call fetch-results edge function
        run: |
          curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/fetch-results" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
          cat response.json
